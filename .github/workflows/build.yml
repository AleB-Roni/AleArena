name: Build AleArena

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Plugin bauen
        run: gradle build --no-daemon || gradle build --no-daemon -PpaperApi="26.2.build.+"

      - uses: actions/upload-artifact@v4
        with:
          name: AleArena
          path: build/libs/AleArena-*.jar

      - name: Als "latest" veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AleArena (aktueller Build)
          prerelease: true
          files: build/libs/AleArena-*.jar
